[project]
name = "sentinel-asi"
version = "0.1.0"
description = "Sentinel ASI: attack surface intelligence (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "celery[redis]>=5.4,<6",
    "redis>=5.2,<6",
    "pyyaml>=6.0.2,<7",
    "httpx>=0.27,<1",
    "rapidfuzz>=3.10,<4",
    "defusedxml>=0.7.1,<1",
    "pyjwt[crypto]>=2.9,<3",
    "mcp>=1.30,<2",
    "paramiko>=3.5,<4",
    "weasyprint>=70,<71",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "types-PyYAML>=6.0.12",
    "types-defusedxml>=0.7",
    "celery-types>=0.22",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "T20", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # polskie znaki w tekstach i komentarzach

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
# paramiko nie ma typów w pakiecie; types-paramiko jest za starą wersją 3.x.
module = ["paramiko", "paramiko.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
