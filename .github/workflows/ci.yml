name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalacja zależności
        run: uv sync --frozen --extra dev --python 3.12
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy app tests
      - name: Pytest (bez sieci i bez modelu)
        run: uv run pytest

  ai-tests-mock:
    name: AI tests, atrapa
    uses: ./.github/workflows/ai-tests.yml
    with:
      suite: mock

  ai-tests-qwen:
    name: AI tests, Qwen3 4B
    needs: ai-tests-mock
    uses: ./.github/workflows/ai-tests.yml
    with:
      suite: qwen

  migrations:
    name: Migracje na PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      # Migracje jak w Compose: jako użytkownik aplikacji, nie administrator bazy.
      DATABASE_URL: postgresql+psycopg://sentinel_app:ci-only-app@localhost:5432/sentinel
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Użytkownicy bazy (infra/postgres/init_roles.sql)
        env:
          PGHOST: localhost
          PGUSER: sentinel
          PGPASSWORD: ci-only
          PGDATABASE: sentinel
        run: |
          psql -q -v app_user=sentinel_app -v app_password=ci-only-app \
            -v keycloak_user=keycloak -v keycloak_password=ci-only-kcdb \
            -v harness_user=sentinel_harness -v harness_password=ci-only-harness \
            -v db_name=sentinel -f ../infra/postgres/init_roles.sql
      - name: Migracja w górę, w dół i ponownie w górę
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Modele zgodne z migracjami
        run: uv run alembic check
      - name: Wyniki testu agenta tylko dla harnessu (infra/postgres/harden_harness.sql)
        env:
          PGHOST: localhost
          PGUSER: sentinel
          PGPASSWORD: ci-only
          PGDATABASE: sentinel
        run: |
          psql -q -v app_user=sentinel_app -v harness_user=sentinel_harness \
            -f ../infra/postgres/harden_harness.sql
      - name: Rozdział użytkowników bazy (aplikacja, Keycloak, harness)
        env:
          SENTINEL_TEST_APP_DB_URL: postgresql+psycopg://sentinel_app:ci-only-app@localhost:5432/sentinel
          SENTINEL_TEST_KEYCLOAK_DB_URL: postgresql+psycopg://keycloak:ci-only-kcdb@localhost:5432/sentinel
          SENTINEL_TEST_HARNESS_DB_URL: postgresql+psycopg://sentinel_harness:ci-only-harness@localhost:5432/sentinel
        run: uv run pytest tests/test_db_roles.py -o addopts="" -v

  frontend:
    name: Frontend (eslint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Obrazy Dockera i skan Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Konfiguracja z .env.example
        run: cp .env.example .env
      - name: Walidacja docker-compose.yml
        run: docker compose config -q
      - name: Budowanie obrazów
        run: docker compose build api worker-scans frontend
      - name: Trivy (obraz backendu)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sentinel-asi/backend:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy (obraz skanera)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sentinel-asi/scanner:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy (obraz frontendu)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sentinel-asi/frontend:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  e2e-demo:
    name: Ścieżka krytyczna na demo-lab (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Konfiguracja demo (tylko w CI)
        run: |
          cp .env.example .env
          sed -i 's/^DEMO_MODE=false/DEMO_MODE=true/; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only/; s/^KEYCLOAK_ADMIN_PASSWORD=.*/KEYCLOAK_ADMIN_PASSWORD=ci-only-kc/; s/^APP_DB_PASSWORD=.*/APP_DB_PASSWORD=ci-only-app/; s/^KEYCLOAK_DB_PASSWORD=.*/KEYCLOAK_DB_PASSWORD=ci-only-kcdb/' .env
      - name: seed_demo (import, feedy offline, skan, dopasowanie, ocena ryzyka)
        run: ./scripts/seed_demo.sh
      - name: Sprawdzenie wyniku przez API
        run: python3 scripts/check_demo.py http://localhost:8080
      - name: Scenariusz zero-day (syntetyczny wpis KEV, raport w skrzynce poniżej 5 s)
        run: |
          ./scripts/inject_kev.sh | tee zero-day.json
          python3 - <<'PY'
          import json, sys
          text = open("zero-day.json", encoding="utf-8").read()
          total = json.loads(text[text.index("\n{") + 1 if not text.startswith("{") else 0:])["timings_ms"]["total"]
          print("czas od wpisu KEV do raportu w skrzynce:", total, "ms")
          sys.exit(total >= 5000)
          PY
          python3 scripts/check_demo.py http://localhost:8080 --zero-day
      - name: Zużycie pamięci przez kontenery (do budżetu RAM)
        if: always()
        run: docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}'
      - name: Logi przy błędzie
        if: failure()
        run: docker compose --profile demo logs --no-color --tail 200

  security:
    name: Zależności, konfiguracja i sekrety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trivy (zależności i konfiguracja)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          # demo-lab jest celowo podatny i izolowany; nie jest częścią produktu
          skip-dirs: demo-lab
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Gitleaks (sekrety w całej historii)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
