name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalacja zależności
        run: uv sync --frozen --extra dev --python 3.12
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy app tests
      - name: Pytest (bez sieci i bez modelu)
        run: uv run pytest

  migrations:
    name: Migracje na PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://sentinel:ci-only@localhost:5432/sentinel
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Migracja w górę, w dół i ponownie w górę
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Modele zgodne z migracjami
        run: uv run alembic check

  frontend:
    name: Frontend (eslint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Obrazy Dockera i skan Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Konfiguracja z .env.example
        run: cp .env.example .env
      - name: Walidacja docker-compose.yml
        run: docker compose config -q
      - name: Budowanie obrazów
        run: docker compose build api frontend
      - name: Trivy (obraz backendu)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sentinel-asi/backend:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy (obraz frontendu)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sentinel-asi/frontend:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  security:
    name: Zależności, konfiguracja i sekrety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trivy (zależności i konfiguracja)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          # demo-lab jest celowo podatny i izolowany; nie jest częścią produktu
          skip-dirs: demo-lab
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Gitleaks (sekrety w całej historii)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
