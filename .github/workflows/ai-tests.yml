name: AI tests (promptfoo)

# Testy własnego AI: pośrednie prompt injection przez opisy CVE (ai-tests/README.md).
# - mock: posłuszna atrapa, wszystkie przypadki, każdy PR (wywołanie z ci.yml)
# - qwen: Qwen3 4B, przypadki z `qwen: true`, każdy PR (wywołanie z ci.yml)
# - full: Qwen3 4B, wszystkie przypadki, nocą i ręcznie
on:
  workflow_call:
    inputs:
      suite:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [full, qwen, mock]
        default: full
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

env:
  SUITE: ${{ inputs.suite || 'full' }}
  LLM_MODEL: qwen3-4b-q4km
  OLLAMA_URL: http://localhost:11434
  OLLAMA_IMAGE: ollama/ollama:0.40.16
  # Plik i suma jak w scripts/fetch_models.sh.
  MODEL_URL: https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/bc640142c66e1fdd12af0bd68f40445458f3869b/Qwen3-4B-Q4_K_M.gguf
  MODEL_FILE: Qwen3-4B-Q4_K_M.gguf
  MODEL_SHA256: 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5

jobs:
  promptfoo:
    name: promptfoo (${{ inputs.suite || 'full' }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.suite || 'full') == 'mock' && 15 || ((inputs.suite || 'full') == 'qwen' && 60 || 240) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Zależności backendu (ta sama ścieżka co aplikacja)
        working-directory: backend
        run: uv sync --frozen --extra dev --python 3.12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-tests/package-lock.json
      - name: promptfoo (wersja przypięta w package-lock.json)
        working-directory: ai-tests
        run: npm ci --no-audit --no-fund
      - name: Ruff (ai-tests)
        working-directory: backend
        run: uv run ruff check ../ai-tests && uv run ruff format --check ../ai-tests

      - name: Model w cache
        if: env.SUITE != 'mock'
        id: model-cache
        uses: actions/cache@v6
        with:
          path: data/models/${{ env.MODEL_FILE }}
          key: model-${{ env.MODEL_SHA256 }}
      - name: Pobranie modelu (tylko bez cache, z kontrolą SHA-256)
        if: env.SUITE != 'mock' && steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/models
          curl -fL --retry 5 -o "data/models/$MODEL_FILE" "$MODEL_URL"
          echo "$MODEL_SHA256  data/models/$MODEL_FILE" | sha256sum -c
      - name: Ollama z modelem (bez internetu dla modelu)
        if: env.SUITE != 'mock'
        run: |
          docker run -d --name ollama -p 127.0.0.1:11434:11434 \
            -e OLLAMA_KEEP_ALIVE=-1 -e OLLAMA_NUM_PARALLEL=1 \
            -v "$PWD/data/models:/models:ro" -v "$PWD/llm:/modelfiles:ro" "$OLLAMA_IMAGE"
          for _ in $(seq 1 60); do curl -fs "$OLLAMA_URL/api/tags" >/dev/null && break; sleep 1; done
          docker exec ollama ollama create "$LLM_MODEL" -f /modelfiles/Modelfile.qwen3-4b
          echo "CPU: $(nproc) rdzeni, RAM: $(free -g | awk '/Mem:/ {print $2}') GB"

      - name: promptfoo ${{ env.SUITE }}
        working-directory: ai-tests
        run: ./run.sh "$SUITE"
      - name: Wyniki w podsumowaniu zadania
        if: always()
        working-directory: ai-tests
        run: python3 summary.py "results/$SUITE.json" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Wyniki jako artefakt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-tests-${{ env.SUITE }}
          path: ai-tests/results/
          retention-days: 14
      - name: Zużycie pamięci przez Ollamę
        if: always() && env.SUITE != 'mock'
        run: docker stats --no-stream ollama || true
