# Sentinel ASI: całość jednym poleceniem `docker compose up`.
#
# Sieci (docs/ARCHITECTURE.md, sekcja 3):
#   core      API, baza, kolejka, workery. Bez dostępu do celów skanowania.
#   llm       model językowy (Ollama). `internal: true`: model nie ma wyjścia do internetu,
#             a widzą go tylko API (stan modelu) i worker `llm` (generowanie).
#   Keycloak (logowanie, MFA) działa w `core`: korzysta z tej samej bazy (osobny schemat
#             `keycloak`), a z zewnątrz jest dostępny tylko przez nginx pod /auth/realms.
#   demo-lab  celowo podatne środowisko testowe. `internal: true`, czyli bez wyjścia
#             na zewnątrz i bez portów na hoście. Widzą ją wyłącznie worker `scans`
#             (deterministyczny potok) i `mcp-scanner` (jedyna droga agenta do sieci).
#   vault     OpenBao (poświadczenia JIT). `internal: true`; widzi go tylko `mcp-scanner`.

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: runtime
  image: sentinel-asi/backend:dev
  env_file: .env
  environment: &backend-env
    POSTGRES_HOST: db
    # Aplikacja łączy się własnym użytkownikiem (właściciel schematu public), nie
    # administratorem bazy; zakłada go usługa db-init.
    POSTGRES_USER: ${APP_DB_USER:-sentinel_app}
    POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Ustaw APP_DB_PASSWORD w pliku .env}
    REDIS_URL: redis://redis:6379/0
    # Domyślnie pusty zakres. scripts/seed_demo.sh podaje zakres demo-lab.
    SCOPE_FILE: ${SCOPE_FILE:-/app/rules/scope.yaml}
    DEMO_APPROVAL_EXPIRES_AT: ${DEMO_APPROVAL_EXPIRES_AT:-}
    FEEDS_DIR: /app/data/feeds
    DEMO_FEEDS_DIR: /app/demo-feeds
    # Tokeny wystawia Keycloak pod publicznym adresem interfejsu; klucze API pobiera
    # wewnętrznie, z sieci core.
    OIDC_ISSUER: ${PUBLIC_URL:-http://localhost:8080}/auth/realms/sentinel
    OIDC_JWKS_URL: http://keycloak:8080/auth/realms/sentinel/protocol/openid-connect/certs
  volumes:
    # Snapshoty feedów pobrane przez scripts/fetch_feeds.sh (poza Gitem).
    - ./data/feeds:/app/data/feeds:ro
    # Miniaturowy, ręcznie przygotowany zestaw demo oraz fikcyjny inwentarz demo-lab.
    - ./backend/tests/fixtures/feeds:/app/demo-feeds:ro
    - ./demo-lab:/app/demo-lab:ro
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - core
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - core
    mem_limit: 768m

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - core
    mem_limit: 320m

  # Osobni użytkownicy bazy dla aplikacji i Keycloaka, każdy z dostępem tylko do własnego
  # schematu. Jedyna usługa, która zna hasło administratora bazy.
  db-init:
    image: postgres:16-alpine
    command:
      - sh
      - -c
      - >-
        psql -q -v app_user="$$APP_DB_USER" -v app_password="$$APP_DB_PASSWORD"
        -v keycloak_user="$$KEYCLOAK_DB_USER" -v keycloak_password="$$KEYCLOAK_DB_PASSWORD"
        -v harness_user="$$HARNESS_DB_USER" -v harness_password="$$HARNESS_DB_PASSWORD"
        -v db_name="$$PGDATABASE" -f /init/init_roles.sql
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-sentinel}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
      PGDATABASE: ${POSTGRES_DB:-sentinel}
      APP_DB_USER: ${APP_DB_USER:-sentinel_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Ustaw APP_DB_PASSWORD w pliku .env}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Ustaw KEYCLOAK_DB_PASSWORD w pliku .env}
      HARNESS_DB_USER: ${HARNESS_DB_USER:-sentinel_harness}
      HARNESS_DB_PASSWORD: ${HARNESS_DB_PASSWORD:?Ustaw HARNESS_DB_PASSWORD w pliku .env}
    volumes:
      - ./infra/postgres:/init:ro
    restart: "no"
    networks:
      - core
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 64m

  migrate:
    <<: *backend
    # Migracje (w tym schemat `keycloak`) i kopia rules/roles.yaml w tabelach iam_*.
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli sync-roles"]
    restart: "no"
    depends_on:
      db-init:
        condition: service_completed_successfully

  # Moduł 19: tabele wyników testu agenta na własność harnessu; aplikacja ma tylko odczyt.
  db-harden:
    image: postgres:16-alpine
    command:
      - sh
      - -c
      - >-
        psql -q -v app_user="$$APP_DB_USER" -v harness_user="$$HARNESS_DB_USER"
        -f /init/harden_harness.sql
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-sentinel}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
      PGDATABASE: ${POSTGRES_DB:-sentinel}
      APP_DB_USER: ${APP_DB_USER:-sentinel_app}
      HARNESS_DB_USER: ${HARNESS_DB_USER:-sentinel_harness}
    volumes:
      - ./infra/postgres:/init:ro
    restart: "no"
    networks:
      - core
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 64m

  # Logowanie OIDC, MFA (TOTP), blokada po nieudanych próbach. Realm z infra/keycloak.
  keycloak:
    image: keycloak/keycloak:26.8.2
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sentinel}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Ustaw KEYCLOAK_DB_PASSWORD w pliku .env}
      KC_DB_SCHEMA: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      # Adres, pod którym przeglądarka widzi Keycloaka (przez nginx). Wewnątrz sieci core
      # API pobiera klucze z http://keycloak:8080 (backchannel dynamiczny).
      KC_HOSTNAME: ${PUBLIC_URL:-http://localhost:8080}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Tymczasowe konto administratora Keycloaka; konsola /auth/admin nie jest wystawiona
      # przez nginx, używa go tylko kcadm.sh w kontenerze (seed_demo, breakglass).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Ustaw KEYCLOAK_ADMIN_PASSWORD w pliku .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # Sekret konta usługowego agenta (placeholder w realmie, tylko przy pierwszym imporcie).
      AGENT_CLIENT_SECRET: ${AGENT_CLIENT_SECRET:?Ustaw AGENT_CLIENT_SECRET w pliku .env}
      # Sekret konta usługowego kill switcha (wyłącza klienta agenta przez admin API).
      KILLSWITCH_CLIENT_SECRET: ${KILLSWITCH_CLIENT_SECRET:?Ustaw KILLSWITCH_CLIENT_SECRET w pliku .env}
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=30
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - core
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 900m

  api:
    # host.docker.internal: podgląd i przebiegi na labie mentorów (scripts/mentor_lab.sh).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    <<: *backend
    environment:
      <<: *backend-env
      # Kill switch: hurtowe odwołanie tokenów mcp-scanner (AppRole `killswitch`, polityka
      # tylko revoke-prefix). Klienta agenta w Keycloak wyłącza przez sieć core.
      OPENBAO_URL: http://openbao:8200
      OPENBAO_KILLSWITCH_FILE: /run/openbao-killswitch/approle.json
    volumes:
      - ./data/feeds:/app/data/feeds:ro
      - ./backend/tests/fixtures/feeds:/app/demo-feeds:ro
      - ./demo-lab:/app/demo-lab:ro
      - openbao-killswitch:/run/openbao-killswitch:ro
    networks:
      - core
      - llm
      - vault
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      bao-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        # ProxyHandler({}) pomija ewentualne zmienne HTTP_PROXY z .env
        - "import urllib.request as u,sys; sys.exit(0 if u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m

  worker-core:
    # host.docker.internal: podgląd i przebiegi na labie mentorów (scripts/mentor_lab.sh).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "default", "-c", "2", "-n", "core@%h", "--loglevel", "INFO"]
    mem_limit: 512m

  worker-feeds:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "feeds", "-c", "1", "-n", "feeds@%h", "--loglevel", "INFO"]
    mem_limit: 384m

  # Jedyny kontener z dostępem do sieci, w której są cele skanowania.
  worker-scans:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: scanner
    image: sentinel-asi/scanner:dev
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "scans", "-c", "2", "-n", "scans@%h", "--loglevel", "INFO"]
    # Warstwa 1 red team (docs/WARSTWY.md) uruchamia nuclei: ta sama binarka i te same
    # szablony wykrywające co w mcp-scanner, tylko do odczytu. Bez nich przebieg zapisuje
    # adnotację „nuclei pominięty”, a wynik nmap zostaje.
    environment:
      <<: *backend-env
      # nuclei zapisuje konfigurację w katalogu domowym; system plików jest tylko do odczytu.
      HOME: /tmp
      PATH: /opt/nuclei/bin:/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ./data/feeds:/app/data/feeds:ro
      - ./backend/tests/fixtures/feeds:/app/demo-feeds:ro
      - ./demo-lab:/app/demo-lab:ro
      - ./data/nuclei/bin:/opt/nuclei/bin:ro
      - ./data/nuclei/templates:/opt/nuclei-templates:ro
    # Komputer z labem mentorów (porty na localhost) widziany z kontenera. Nic nie skanuje,
    # dopóki adres nie jest w zakresie (rules/scope.mentor-lab.yaml, scripts/mentor_lab.sh).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      core:
      demo-lab:
        # Stały adres skanera; jest na denyliście w rules/scope.demo.yaml.
        ipv4_address: 172.30.99.250
    mem_limit: 768m

  # Inferencja zawsze po jednym zadaniu naraz.
  worker-llm:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "llm", "-c", "1", "-n", "llm@%h", "--loglevel", "INFO"]
    networks:
      - core
      - llm
    mem_limit: 384m

  # --- Etap 5: agent AI -------------------------------------------------------------
  # Serwer MCP: jedyna droga agenta do narzędzi i sieci celów. Polityka, scope_guard,
  # poświadczenia JIT z OpenBao i audyt dla każdego wywołania (ARCHITECTURE §5.1).
  mcp-scanner:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: scanner
    image: sentinel-asi/scanner:dev
    command: ["python", "-m", "app.mcp_server.server"]
    environment:
      <<: *backend-env
      HOME: /tmp
      PATH: /opt/nuclei/bin:/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      OPENBAO_URL: http://openbao:8200
      OPENBAO_APPROLE_FILE: /run/openbao/approle.json
      SSH_KNOWN_HOSTS: /run/lab-ssh/known_hosts
      MCP_URL: http://mcp-scanner:8001/mcp
    volumes:
      # nuclei i wyłącznie szablony wykrywające (scripts/fetch_nuclei.sh), tylko do odczytu.
      - ./data/nuclei/bin:/opt/nuclei/bin:ro
      - ./data/nuclei/templates:/opt/nuclei-templates:ro
      - openbao-approle:/run/openbao:ro
      - lab-ssh-known:/run/lab-ssh:ro
    networks:
      core:
      vault:
      demo-lab:
        # Stały adres; jest na denyliście w rules/scope.demo.yaml.
        ipv4_address: 172.30.99.251
    depends_on:
      migrate:
        condition: service_completed_successfully
      bao-init:
        condition: service_completed_successfully
    mem_limit: 512m

  # Plan (model) i wykonanie (klient MCP) zadań agenta. Bez dostępu do sieci celów.
  worker-agent:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "agent", "-c", "1", "-n", "agent@%h", "--loglevel", "INFO"]
    environment:
      <<: *backend-env
      MCP_URL: http://mcp-scanner:8001/mcp
    networks:
      - core
      - llm
    mem_limit: 384m

  # Moduł 19: niezależny test bezpieczeństwa agenta. Osobny worker, osobna kolejka i osobny
  # użytkownik bazy (właściciel tabel wyników). Klucz podpisu tylko w wolumenie harnessu.
  worker-harness:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "agent_tests", "-c", "1", "-n", "harness@%h", "--loglevel", "INFO"]
    environment:
      <<: *backend-env
      POSTGRES_USER: ${HARNESS_DB_USER:-sentinel_harness}
      POSTGRES_PASSWORD: ${HARNESS_DB_PASSWORD:?Ustaw HARNESS_DB_PASSWORD w pliku .env}
      AGENT_CASES_FILE: /app/ai-tests/agent/cases.yaml
      HARNESS_SIGNING_KEY: /app/data/harness/signing_key.pem
    volumes:
      - ./ai-tests/agent:/app/ai-tests/agent:ro
      - harness-key:/app/data/harness
    networks:
      - core
      - llm
    depends_on:
      db-harden:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 384m

  # OpenBao: poświadczenia just-in-time (certyfikaty SSH na 15 minut). Tylko sieć `vault`.
  openbao:
    image: openbao/openbao:2.7.2
    command: ["server", "-config=/etc/openbao/config.hcl"]
    volumes:
      - ./infra/openbao/config.hcl:/etc/openbao/config.hcl:ro
      - openbao-data:/openbao/file
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - vault
    mem_limit: 256m

  # Jednorazowo przy każdym starcie: inicjalizacja, rozpieczętowanie, CA SSH, AppRole.
  bao-init:
    image: openbao/openbao:2.7.2
    entrypoint: ["/bin/sh", "/policies/init.sh"]
    user: "0:0"
    environment:
      BAO_ADDR: http://openbao:8200
      NO_PROXY: openbao,localhost,127.0.0.1
      no_proxy: openbao,localhost,127.0.0.1
    volumes:
      - ./infra/openbao:/policies:ro
      - openbao-init:/bao-state
      - openbao-approle:/out/approle
      - openbao-killswitch:/out/killswitch
      - openbao-ca:/out/ca
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - vault
    depends_on:
      - openbao
    mem_limit: 64m

  # Lokalny model językowy. Bez portów na hoście i bez dostępu do internetu: pliki modeli
  # pobiera na hoście scripts/fetch_models.sh, a kontener tylko je wczytuje.
  # Opcjonalny (profil llm): bez niego Sentek i objaśnienia działają na słowach kluczowych
  # i szablonach. start.sh włącza go sam, gdy w data/models są pliki modelu albo SENTINEL_LLM=1.
  ollama:
    image: ollama/ollama:0.40.16
    profiles: ["llm"]
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NOPRUNE: "1"
    volumes:
      - ollama-data:/root/.ollama
      - ./data/models:/models:ro
      - ./llm:/modelfiles:ro
    restart: unless-stopped
    networks:
      - llm
    mem_limit: 6g

  beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--schedule", "/tmp/celerybeat-schedule", "--loglevel", "INFO"]
    mem_limit: 256m

  frontend:
    build:
      context: frontend
    image: sentinel-asi/frontend:dev
    ports:
      # Domyślnie tylko lokalnie. Wystawienie w sieci (SENTINEL_BIND=0.0.0.0) wymaga HTTPS:
      # ciasteczka logowania Keycloaka mają flagę Secure (README, sekcja „Logowanie”).
      - "${SENTINEL_BIND:-127.0.0.1}:8080:8080"
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - core
    mem_limit: 128m

  # --- skrzynka pocztowa demo (Mailpit): łapie e-maile z raportami i digestami, nic nie wysyła
  # dalej. Interfejs tylko na localhost:8025. W .env: SMTP_HOST=mailpit, SMTP_PORT=1025,
  # SMTP_STARTTLS=false (patrz .env.example).
  mailpit:
    image: axllent/mailpit:v1.21.8
    profiles: ["demo"]
    environment:
      MP_MAX_MESSAGES: "200"
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - core
    restart: unless-stopped
    read_only: true
    # Mailpit trzyma skrzynkę w bazie w /tmp (pamięć, znika z kontenerem).
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m

  # --- demo-lab: CELOWO PODATNE usługi, tylko z profilem `demo` (demo-lab/README.md).
  # Bez portów na hoście i tylko w sieci `internal`, do której ma dostęp wyłącznie skaner.
  lab-web:
    image: httpd:2.4.49
    profiles: ["demo"]
    restart: unless-stopped
    networks:
      demo-lab:
        ipv4_address: 172.30.99.10
    mem_limit: 128m

  lab-proxy:
    image: nginx:1.18.0
    profiles: ["demo"]
    restart: unless-stopped
    networks:
      demo-lab:
        ipv4_address: 172.30.99.11
    mem_limit: 128m

  lab-legacy:
    image: vulnerables/web-dvwa:latest
    profiles: ["demo"]
    restart: unless-stopped
    networks:
      demo-lab:
        ipv4_address: 172.30.99.12
    mem_limit: 512m

  lab-shop:
    image: bkimminich/juice-shop:v17.1.1
    profiles: ["demo"]
    restart: unless-stopped
    networks:
      demo-lab:
        ipv4_address: 172.30.99.13
    mem_limit: 512m

  lab-cache:
    image: redis:5.0.7
    profiles: ["demo"]
    restart: unless-stopped
    networks:
      demo-lab:
        ipv4_address: 172.30.99.14
    mem_limit: 128m

  # „Zatruty host” (scenariusz demo 6): baner Server i tytuł strony z poleceniem dla agenta.
  lab-poisoned:
    image: python:3.12-alpine
    profiles: ["demo"]
    command: ["python", "/srv/server.py"]
    volumes:
      - ./demo-lab/poisoned:/srv:ro
    restart: unless-stopped
    read_only: true
    networks:
      demo-lab:
        ipv4_address: 172.30.99.15
    mem_limit: 64m

  # Host do skanu uwierzytelnionego: SSH tylko z certyfikatem z CA OpenBao (15 minut).
  lab-ssh:
    build:
      context: demo-lab/ssh
    image: sentinel-asi/lab-ssh:dev
    profiles: ["demo"]
    environment:
      LAB_SSH_ADDRESS: 172.30.99.16
    volumes:
      - openbao-ca:/ca:ro
      - lab-ssh-known:/known
    restart: unless-stopped
    networks:
