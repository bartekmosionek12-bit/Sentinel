# Sentinel ASI: całość jednym poleceniem `docker compose up`.
#
# Sieci (docs/ARCHITECTURE.md, sekcja 3):
#   core      API, baza, kolejka, workery. Bez dostępu do celów skanowania.
#   llm       model językowy (Ollama). `internal: true`: model nie ma wyjścia do internetu,
#             a widzą go tylko API (stan modelu) i worker `llm` (generowanie).
#   Keycloak (logowanie, MFA) działa w `core`: korzysta z tej samej bazy (osobny schemat
#             `keycloak`), a z zewnątrz jest dostępny tylko przez nginx pod /auth/realms.
#   demo-lab  celowo podatne środowisko testowe. `internal: true`, czyli bez wyjścia
#             na zewnątrz i bez portów na hoście. Widzi ją wyłącznie worker `scans`.

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: runtime
  image: sentinel-asi/backend:dev
  env_file: .env
  environment:
    POSTGRES_HOST: db
    # Aplikacja łączy się własnym użytkownikiem (właściciel schematu public), nie
    # administratorem bazy; zakłada go usługa db-init.
    POSTGRES_USER: ${APP_DB_USER:-sentinel_app}
    POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Ustaw APP_DB_PASSWORD w pliku .env}
    REDIS_URL: redis://redis:6379/0
    # Domyślnie pusty zakres. scripts/seed_demo.sh podaje zakres demo-lab.
    SCOPE_FILE: ${SCOPE_FILE:-/app/rules/scope.yaml}
    DEMO_APPROVAL_EXPIRES_AT: ${DEMO_APPROVAL_EXPIRES_AT:-}
    FEEDS_DIR: /app/data/feeds
    DEMO_FEEDS_DIR: /app/demo-feeds
    # Tokeny wystawia Keycloak pod publicznym adresem interfejsu; klucze API pobiera
    # wewnętrznie, z sieci core.
    OIDC_ISSUER: ${PUBLIC_URL:-http://localhost:8080}/auth/realms/sentinel
    OIDC_JWKS_URL: http://keycloak:8080/auth/realms/sentinel/protocol/openid-connect/certs
  volumes:
    # Snapshoty feedów pobrane przez scripts/fetch_feeds.sh (poza Gitem).
    - ./data/feeds:/app/data/feeds:ro
    # Miniaturowy, ręcznie przygotowany zestaw demo oraz fikcyjny inwentarz demo-lab.
    - ./backend/tests/fixtures/feeds:/app/demo-feeds:ro
    - ./demo-lab:/app/demo-lab:ro
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - core
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - core
    mem_limit: 768m

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - core
    mem_limit: 320m

  # Osobni użytkownicy bazy dla aplikacji i Keycloaka, każdy z dostępem tylko do własnego
  # schematu. Jedyna usługa, która zna hasło administratora bazy.
  db-init:
    image: postgres:16-alpine
    command:
      - sh
      - -c
      - >-
        psql -q -v app_user="$$APP_DB_USER" -v app_password="$$APP_DB_PASSWORD"
        -v keycloak_user="$$KEYCLOAK_DB_USER" -v keycloak_password="$$KEYCLOAK_DB_PASSWORD"
        -v db_name="$$PGDATABASE" -f /init/init_roles.sql
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-sentinel}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
      PGDATABASE: ${POSTGRES_DB:-sentinel}
      APP_DB_USER: ${APP_DB_USER:-sentinel_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Ustaw APP_DB_PASSWORD w pliku .env}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Ustaw KEYCLOAK_DB_PASSWORD w pliku .env}
    volumes:
      - ./infra/postgres:/init:ro
    restart: "no"
    networks:
      - core
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 64m

  migrate:
    <<: *backend
    # Migracje (w tym schemat `keycloak`) i kopia rules/roles.yaml w tabelach iam_*.
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli sync-roles"]
    restart: "no"
    depends_on:
      db-init:
        condition: service_completed_successfully

  # Logowanie OIDC, MFA (TOTP), blokada po nieudanych próbach. Realm z infra/keycloak.
  keycloak:
    image: keycloak/keycloak:26.8.2
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sentinel}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Ustaw KEYCLOAK_DB_PASSWORD w pliku .env}
      KC_DB_SCHEMA: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      # Adres, pod którym przeglądarka widzi Keycloaka (przez nginx). Wewnątrz sieci core
      # API pobiera klucze z http://keycloak:8080 (backchannel dynamiczny).
      KC_HOSTNAME: ${PUBLIC_URL:-http://localhost:8080}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Tymczasowe konto administratora Keycloaka; konsola /auth/admin nie jest wystawiona
      # przez nginx, używa go tylko kcadm.sh w kontenerze (seed_demo, breakglass).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Ustaw KEYCLOAK_ADMIN_PASSWORD w pliku .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=30
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - core
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 900m

  api:
    <<: *backend
    networks:
      - core
      - llm
    healthcheck:
      test:
        - CMD
        - python
        - -c
        # ProxyHandler({}) pomija ewentualne zmienne HTTP_PROXY z .env
        - "import urllib.request as u,sys; sys.exit(0 if u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m

  worker-core:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "default", "-c", "2", "-n", "core@%h", "--loglevel", "INFO"]
    mem_limit: 512m

  worker-feeds:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "feeds", "-c", "1", "-n", "feeds@%h", "--loglevel", "INFO"]
    mem_limit: 384m

  # Jedyny kontener z dostępem do sieci, w której są cele skanowania.
  worker-scans:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: scanner
    image: sentinel-asi/scanner:dev
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "scans", "-c", "2", "-n", "scans@%h", "--loglevel", "INFO"]
    networks:
      core:
      demo-lab:
        # Stały adres skanera; jest na denyliście w rules/scope.demo.yaml.
        ipv4_address: 172.30.99.250
    mem_limit: 768m

  # Inferencja zawsze po jednym zadaniu naraz.
  worker-llm:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "llm", "-c", "1", "-n", "llm@%h", "--loglevel", "INFO"]
    networks:
      - core
      - llm
    mem_limit: 384m

  # Lokalny model językowy. Bez portów na hoście i bez dostępu do internetu: pliki modeli
  # pobiera na hoście scripts/fetch_models.sh, a kontener tylko je wczytuje.
  ollama:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NOPRUNE: "1"
    volumes:
      - ollama-data:/root/.ollama
      - ./data/models:/models:ro
      - ./llm:/modelfiles:ro
    restart: unless-stopped
    networks:
      - llm
    mem_limit: 6g

  beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--schedule", "/tmp/celerybeat-schedule", "--loglevel", "INFO"]
    mem_limit: 256m

  frontend:
    build:
      context: frontend
    image: sentinel-asi/frontend:dev
    ports:
      # Domyślnie tylko lokalnie. Wystawienie w sieci (SENTINEL_BIND=0.0.0.0) wymaga HTTPS:
      # ciasteczka logowania Keycloaka mają flagę Secure (README, sekcja „Logowanie”).
      - "${SENTINEL_BIND:-127.0.0.1}:8080:8080"
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - core
    mem_limit: 128m

  # --- demo-lab: CELOWO PODATNE usługi, tylko z profilem `demo` (demo-lab/README.md).
  # Bez portów na hoście i tylko w sieci `internal`, do której ma dostęp wyłącznie skaner.
  lab-web:
    image: httpd:2.4.49
    profiles: ["demo"]
    restart: unless-stopped
    networks:
      demo-lab:
        ipv4_address: 172.30.99.10
    mem_limit: 128m

  lab-proxy:
    image: nginx:1.18.0
    profiles: ["demo"]
    restart: unless-stopped
    networks:
      demo-lab:
        ipv4_address: 172.30.99.11
    mem_limit: 128m

  lab-legacy:
    image: vulnerables/web-dvwa:latest
    profiles: ["demo"]
    restart: unless-stopped
    networks:
      demo-lab:
        ipv4_address: 172.30.99.12
    mem_limit: 512m

  lab-shop:
    image: bkimminich/juice-shop:v17.1.1
    profiles: ["demo"]
    restart: unless-stopped
    networks:
      demo-lab:
        ipv4_address: 172.30.99.13
    mem_limit: 512m

  lab-cache:
    image: redis:5.0.7
    profiles: ["demo"]
    restart: unless-stopped
    networks:
      demo-lab:
        ipv4_address: 172.30.99.14
    mem_limit: 128m

networks:
  core:
  llm:
    internal: true
  demo-lab:
    internal: true
    ipam:
      config:
        # Musi zgadzać się z DEMO_LAB_CIDR w .env
        - subnet: 172.30.99.0/24

volumes:
  db-data:
  ollama-data:
