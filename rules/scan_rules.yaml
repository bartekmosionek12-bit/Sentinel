# Reguły Scan Plannera. Planner jest deterministyczny: te same fakty dają ten sam plan,
# a przy każdej akcji zapisuje się nazwa reguły, która ją wywołała. Żaden LLM nie bierze
# udziału w decyzji. Każda akcja i tak przechodzi przez scope_guard.
#
# trigger: sweep         raz na każdą dozwoloną sieć (allow.cidrs)
#          host_seen     dla hosta, który odpowiedział w odkrywaniu
#          finding_open  dla hosta z otwartym findingiem
# intrusiveness: 1 = L1 pasywne i lekkie, 2 = L2 inwazyjne (zgoda admina), 3 = L3 red team AI
# (zgoda admina z uprawnieniem scan:approve:l3). Poziom 4 i wyżej: zabronione.
# Dla hosta wygrywa pierwsza pasująca reguła danego wyzwalacza.

# Porty lekkiego skanu usług: SUMA listy nmap „top 1000” i portów dodatkowych poniżej.
# Sama lista „top 1000” pomija m.in. Redisa (6379), więc dopisujemy porty systemowe oraz
# typowe porty baz danych, kolejek, paneli i serwerów aplikacji. `top-1000` rozwija się do
# stałej listy z backend/app/scanners/top_ports.py; elementy po przecinku ją powiększają.
service_ports: &service_ports "top-1000,1-1024,1433,1521,2049,2181,2375-2376,3000,3306,3389,5000,5432,5601,5672,5900,5984,6379,7001,8000-8100,8443,8888,9000,9090-9093,9200,9300,11211,15672,27017,50000"

rules:
  - name: scope_sweep
    description: Odkrywanie hostów w dozwolonej sieci
    trigger: sweep
    tool: nmap
    mode: discover
    intrusiveness: 1

  - name: new_host_service_scan
    description: Skan usług na hoście nowym albo takim, który wrócił do sieci
    trigger: host_seen
    when:
      state: [new, reappeared]
    tool: nmap
    mode: services
    ports: *service_ports
    intrusiveness: 1

  - name: stale_host_service_rescan
    description: Ponowny skan usług, gdy poprzedni jest starszy niż podany czas
    trigger: host_seen
    when:
      state: [known]
      service_scan_older_than_hours: 24
    tool: nmap
    mode: services
    ports: *service_ports
    intrusiveness: 1

  - name: kev_full_port_scan
    description: Pełny skan portów hosta z otwartą podatnością z katalogu KEV
    trigger: finding_open
    when:
      in_kev: true
    tool: nmap
    mode: services
    ports: 1-65535
    intrusiveness: 2
    cooldown_hours: 168
