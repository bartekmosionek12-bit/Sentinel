# Discovery dużej infrastruktury (brief AGH, P3–P5). Domyślnie ostrożnie: nmap nie
# agresywniej niż -T3, limit pakietów na sekundę i liczba równoległych workerów. Interfejs
# pozwala te wartości obniżyć albo podnieść, ale nigdy ponad `limits`.
defaults:
  workers: 4                 # równoległe procesy nmap
  max_rate: 300              # pakiety/s na jeden proces nmap (--max-rate)
  timing: 3                  # szablon czasowy nmap: 0–3 (T4 i T5 są zablokowane)
  batch_initial: 256         # pierwsza paczka adresów
  batch_min: 16
  batch_max: 1024
  batch_target_seconds: 20   # rozmiar kolejnych paczek dobierany do zmierzonej szybkości
  # Porty typowe dla usług wewnętrznych (Gitea 3000/3001, SSH 2222/2223, AMQP i panel RabbitMQ
  # 5672/15672, PostgreSQL na nietypowym porcie, panele proxy 81/8086, Toxiproxy 8474).
  discovery_ports: "21,22,23,25,53,80,110,135,139,143,443,445,993,2222,2223,3000,3001,3306,3389,5432,5672,5673,5900,6379,8000,8080,8081,8085,8086,8088,8089,8090,8443,8474,8787,8888,9200,15432,15672,15673"
  service_ports: "21,22,23,25,53,80,81,110,143,443,445,1433,2222,2223,3000,3001,3306,3389,4000,5000,5432,5601,5672,5673,5900,6379,8000,8008,8080,8081,8082,8083,8085,8086,8088,8089,8090,8181,8443,8474,8787,8888,9000,9090,9200,9443,15432,15672,15673,27017"
  http_paths: ["/admin", "/login"]   # sprawdzane tylko metodą GET, bez wysyłania danych
limits:
  workers: 16
  max_rate: 2000
  timing: 3
  addresses: 70000           # największy zakres jednego przebiegu
# Stan hosta liczony z ostatnich przebiegów obejmujących jego adres.
host_state:
  inactive_after_runs: 3     # nieaktywny po N kolejnych przebiegach bez odpowiedzi
  window: 5                  # ile ostatnich przebiegów brać pod uwagę przy „niestabilny”
