# Role i uprawnienia (RBAC). Źródło prawdy dla backendu: każdy endpoint deklaruje
# uprawnienie, a rola to zestaw uprawnień. Keycloak przechowuje tylko przynależność do ról.
# Zmiana tego pliku = zmiana uprawnień, więc przechodzi przez przegląd w PR.
# Projekt: docs/ARCHITECTURE.md, sekcja 4.
version: 1

# mfa: true = uprawnienie działa tylko z tokenem po uwierzytelnieniu wieloskładnikowym
# (konsola operacyjna /admin). Bez MFA rola admin ma wyłącznie uprawnienia do odczytu.
permissions:
  console:admin: {description: "Wejście do konsoli operacyjnej (/admin); odmowa trafia do audytu", mfa: true}
  inventory:read: {description: "Odczyt inwentarza zasobów"}
  inventory:write: {description: "Dodawanie i import zasobów", mfa: true}
  findings:read: {description: "Odczyt zagrożeń, feedu i wyjaśnień"}
  findings:update: {description: "Zmiana statusu zagrożenia", mfa: true}
  risks:read: {description: "Odczyt rejestru ryzyk"}
  compliance:read: {description: "Odczyt wyników zgodności"}
  reports:read: {description: "Odczyt raportów"}
  reports:export: {description: "Eksport raportów (PDF, CSV, JSON)"}
  notifications:read: {description: "Odczyt powiadomień"}
  personal_data:view: {description: "Podgląd danych osobowych (każdy podgląd w audycie)"}
  secrets:redacted:view: {description: "Pełne dane techniczne (adresy, banery, dowody) poza sekretami"}
  audit:read: {description: "Odczyt dziennika audytu"}
  audit:export: {description: "Eksport dziennika audytu i dowodów"}
  scope:read: {description: "Odczyt zakresu skanowania"}
  scope:manage: {description: "Zmiana zakresu skanowania", mfa: true}
  scan:read: {description: "Odczyt skanów i akcji skanujących"}
  scan:run: {description: "Uruchamianie skanów L1", mfa: true}
  scan:approve:l2: {description: "Zatwierdzanie akcji L2", mfa: true}
  scan:approve:l3: {description: "Zatwierdzanie akcji L3", mfa: true}
  feeds:sync: {description: "Ręczna synchronizacja feedów", mfa: true}
  review:read: {description: "Odczyt kolejki weryfikacji dopasowań"}
  review:decide: {description: "Decyzje w kolejce weryfikacji", mfa: true}
  explanations:generate: {description: "Zlecanie wyjaśnień modelowi lokalnemu", mfa: true}
  llm:external:use: {description: "Użycie zewnętrznego modelu (dane zanonimizowane)", mfa: true}
  llm:external:manage: {description: "Włączanie zewnętrznego modelu", mfa: true}
  agent:task: {description: "Zlecanie zadań agentowi", mfa: true}
  agent:configure: {description: "Nadawanie zdolności agentowi", mfa: true}
  agent:kill: {description: "Kill switch agenta", mfa: true}
  integrations:manage: {description: "Konfiguracja integracji", mfa: true}
  owners:manage: {description: "Przypisywanie właścicieli zasobów", mfa: true}
  iam:manage: {description: "Użytkownicy, role i uprawnienia", mfa: true}
  risk:accept: {description: "Formalna akceptacja ryzyka", mfa: true}

roles:
  admin:
    description: "Administrator, inżynier bezpieczeństwa, IT (konsola /admin, MFA)"
    kind: human
    permissions: "*"
  manager:
    description: "Menedżer: tylko odczyt całej organizacji, dane wrażliwe zredagowane (/dashboard)"
    kind: human
    permissions:
      - inventory:read
      - findings:read
      - risks:read
      - compliance:read
      - reports:read
      - reports:export
      - notifications:read
      - personal_data:view
  auditor:
    description: "Audytor: odczyt i eksport dowodów oraz pełnego dziennika audytu (opcjonalna)"
    kind: human
    permissions:
      - inventory:read
      - findings:read
      - risks:read
      - compliance:read
      - reports:read
      - reports:export
      - notifications:read
      - audit:read
      - audit:export
      - scope:read
      - scan:read
      - review:read
  agent:
    description: "Agent AI (tożsamość nieludzka): wyłącznie zdolności nadane przez admina"
    kind: agent
    permissions: []
  system:
    description: "Deterministyczny pipeline (tożsamość nieludzka)"
    kind: system
    permissions: []
