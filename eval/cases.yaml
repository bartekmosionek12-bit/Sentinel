    product: [apache, http_server, Apache HTTP Server]
    ranges: [wersja 2.4.49]
    fixed: 2.4.51
    cvss: 7.5
    epss: 0.94
    kev: {due: 2021-11-17, action: Apply updates per vendor instructions.}
    exploit: true
    description: A flaw in path normalization in Apache HTTP Server 2.4.49 allows path traversal to files outside the document root; with CGI enabled it can lead to remote code execution.
