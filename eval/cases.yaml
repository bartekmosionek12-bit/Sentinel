# Zestaw ewaluacyjny AI Explainera: publicznie znane podatności z faktami w takiej postaci,
# w jakiej składa je kod z bazy. Wartości EPSS są PRZYKŁADOWE (rząd wielkości), a nie
# pobrane z FIRST; ewaluacja sprawdza wierność modelu faktom z kontekstu, nie same fakty.
#
# expect: elementy, które powinny pojawić się w odpowiedzi (sprawdzane bez wielkości liter).
#   Domyślnie: dla poziomu technicznego i operacyjnego identyfikator CVE i wersja
#   naprawiająca, dla zarządczego słowo „aktualiz”. Pole `expect` dopisuje własne.
cases:
