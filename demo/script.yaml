# Moduł 22: film demo 60 s prowadzony przez Sentka. Jeden plik steruje nagraniem
# (scripts/record_demo.sh), lektorem (scripts/demo_tts.sh), napisami i montażem
# (scripts/assemble_demo.sh). Test w CI (backend/tests/test_demo_script.py i
# frontend/e2e/demo.spec.ts) pilnuje czasu, tempa mowy i istnienia podświetlanych elementów.
#
# Narracja to wersja robocza do podmiany na tekst od Bartka; limit to ok. 140 słów i
# najwyżej 2,6 słowa na sekundę w scenie (tempo lektora po polsku).
version: 1
title: "Sentinel ASI w 60 sekund"
resolution: [1920, 1080]
fps: 30
max_seconds: 60
max_words: 150
max_words_per_second: 2.6

# Elementy: app (dashboard | admin), path, highlight (selektor CSS z data-demo), pose Sentka,
# side (po której stronie stoi Sentek), bubble (krótki dymek na ekranie), narration (lektor
# i napisy), actions (tylko z listy w scripts/record_demo.mjs), end_card (plansza końcowa).
scenes:
  - id: powitanie
    start: 0
    end: 6
    app: dashboard
    path: /
    pose: wave
    side: right
    bubble: "Cześć, jestem Sentek!"
    narration: "Cześć, jestem Sentek. Pokażę, jak Sentinel pilnuje sieci firmy, a decyzje zostają przy ludziach."

  - id: przejrzystosc
    start: 6
    end: 15
    app: dashboard
    path: /mapa
    highlight: '[data-demo="map"]'
    pose: point_left
    side: right
    bubble: "Każde urządzenie ma dział i właściciela"
    narration: "Każde urządzenie ma dział i właściciela. Dwa widać w sieci, a nie ma ich w żadnym rejestrze. To może być shadow IT."

  - id: zero-day
    start: 15
    end: 24
    app: dashboard
    path: /
    actions: [inject_kev]
    highlight: '[data-demo="zero-day-banner"]'
    pose: surprised
    side: right
    bubble: "Nowa podatność z KEV!"
    narration: "Nagle katalog KEV dostaje nową, aktywnie wykorzystywaną podatność. Po sekundzie menedżer widzi baner i wie, których serwerów dotyczy."

  - id: raport
    start: 24
    end: 33
    app: dashboard
    path: /skrzynka
    actions: [open_latest_report]
    highlight: '[data-demo="report-summary"]'
    pose: point_right
    side: left
    bubble: "Pięć pytań, prosty język"
    narration: "Raport odpowiada prostym językiem na pięć pytań: co się stało, czy jesteśmy zagrożeni, kto i do kiedy. Ta sama treść idzie e-mailem."

  - id: bezpieczny-agent
    start: 33
    end: 44
    app: admin
    path: /agent
    highlight: '[data-demo="agent-task"]'
    then:
      at: 6
      highlight: '[data-demo="agent-leases"]'
      bubble: "Certyfikat SSH na 15 minut"
    pose: talk
    side: left
    bubble: "Plan, zgoda admina, skan"
    narration: "Agent tylko planuje sprawdzenie. Skan rusza po zgodzie administratora, z certyfikatem SSH ważnym piętnaście minut, a każdy krok trafia do audytu."

  - id: odpornosc
    start: 44
    end: 53
    app: admin
    path: /agent/test
    highlight: '[data-demo="agent-tests"]'
    pose: thumbs_up
    side: left
    bubble: "Model przejęty, ocena ryzyka bez zmian"
    narration: "Testujemy też samo AI. Przejęty model próbuje zmienić ocenę ryzyka, ale ocenę liczy kod, więc zostaje bez zmian."

  - id: koniec
    start: 53
    end: 60
    app: dashboard
    path: /
    pose: wave
    side: right
    end_card:
      title: "Sentinel ASI"
      line: "Lokalnie · bez GPU · KSC i RODO"
    narration: "Sentinel działa lokalnie, bez GPU, z myślą o KSC i RODO. Dziękuję!"

# Pogłębienia dla jury (20–30 s każde, nagrywane osobno, ten sam mechanizm scen).
deep_dives:
  - {id: rbac, title: "RBAC i redakcja danych", seconds: 25}
  - {id: kill-switch, title: "Kill switch agenta", seconds: 25}
  - {id: zgodnosc, title: "Zgodność: KSC, RODO art. 32, ISO 27001", seconds: 30}
  - {id: artemis, title: "Skaner zewnętrzny (Artemis) i zakres", seconds: 25}
  - {id: samouczek, title: "Samouczek i Sentek dla menedżera", seconds: 20}
